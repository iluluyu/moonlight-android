<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img">
  <rect width="960" height="400" rx="14" fill="#f6f8fa"/>
  <text x="28" y="32" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#1f2328">键盘 / 触控板捕获：Shizuku 与无障碍服务的差别</text>
  <rect x="28" y="56" width="430" height="312" rx="10" fill="#fff8f0" stroke="#f0c48a" stroke-width="1.5"/>
  <text x="243" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1f2328">无障碍服务（AccessibilityService）</text>
  <text x="52" y="108" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  App 注册无障碍服务，由系统转发按键</text>
  <text x="52" y="138" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  事件仍经过系统输入栈</text>
  <text x="52" y="168" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  OEM 快捷键（如 OPPO Win→AI）照常触发</text>
  <text x="52" y="198" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  无法独占设备，Esc 等键行为不稳定</text>
  <text x="52" y="246" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#57606a">权限路径：设置 → 无障碍</text>
  <rect x="52" y="300" width="382" height="48" rx="10" fill="#ffffff" stroke="#f0c48a" stroke-width="1.5"/>
  <text x="243" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#57606a">系统输入栈 → 应用 → 串流</text>
  <rect x="502" y="56" width="430" height="312" rx="10" fill="#eef7f1" stroke="#7cc4a0" stroke-width="1.5"/>
  <text x="717" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#1f2328">Shizuku UserService（本项目采用）</text>
  <text x="526" y="108" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  以 shell / root 身份常驻独立进程</text>
  <text x="526" y="138" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  对 /dev/input/event* 执行 EVIOCGRAB 独占</text>
  <text x="526" y="168" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  事件不再进入系统 → OEM 快捷键不触发</text>
  <text x="526" y="198" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#57606a">·  Esc、Fn 组合、触控板原样交给串流主机</text>
  <text x="526" y="246" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#57606a">权限路径：Shizuku（ADB / 无线调试授权一次）</text>
  <rect x="526" y="300" width="382" height="48" rx="10" fill="#ffffff" stroke="#7cc4a0" stroke-width="1.5"/>
  <text x="717" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#57606a">evdev 独占 → 应用 → 串流</text>
  <line x1="470" y1="212" x2="490" y2="212" stroke="#afb8c1" stroke-width="1.8" marker-end="none"/>
  <polygon points="490,212 482.79224905678063,215.47106991294046 482.79224905678063,208.52893008705954" fill="#afb8c1"/>
  <rect x="502" y="72" width="46" height="20" rx="10" fill="#1a7f37"/>
  <text x="525" y="86" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#ffffff">推荐</text>
  <text x="28" y="388" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="400" fill="#57606a">安全阀：fd 关闭或 UserService 进程退出时内核自动释放 EVIOCGRAB，系统输入立即恢复。</text>
</svg>
